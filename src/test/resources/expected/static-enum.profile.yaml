apiVersion: runtimeconditions.io/v1alpha1
kind: RuntimeConditionsProfile
metadata:
  name: static-enum
workload:
  uri: https://services.example.com/static-enum
extensions:
  - https://runtimeconditions.io/conformance/scoped-domains-collisions:1.0.0
conditions:
  - kind: service
    interface:
      type: http
    mode: proxy
  - kind: service
    interface:
      type: grpc
    mode: streaming
